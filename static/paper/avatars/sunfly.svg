      <stop offset=".45" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#fff" stop-opacity="1"/>
    </linearGradient>
    <mask id="fademask"><rect width="240" height="240" fill="url(#fade)"/></mask>
  </defs>
