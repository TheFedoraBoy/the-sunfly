  <circle cx="120" cy="120" r="78" fill="#2B50E8"/>
  <g clip-path="url(#disc)" mask="url(#fademask)" opacity=".55"><rect width="240" height="240" fill="url(#dots)"/></g>
  <circle cx="120" cy="120" r="78" fill="none" stroke="#16207A" stroke-width="5"/>

  <!-- legs -->
  <g fill="none" stroke="#16207A" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M102 150l-16 10-4 14M138 150l16 10 4 14"/>
    <path d="M103 172l-13 12-1 13M137 172l13 12 1 13"/>
  </g>
  <!-- wings -->
  <g id="wing">
    <path d="M110 128C92 84 44 70 30 100c-13 28 22 58 80 42z" fill="#FFFFFF" stroke="#16207A" stroke-width="5" stroke-linejoin="round"/>
    <path d="M104 130C84 112 62 100 42 100M100 138c-18-4-38-4-54 2" fill="none" stroke="#BFD0FF" stroke-width="4" stroke-linecap="round"/>
  </g>
  <use href="#wing" transform="matrix(-1 0 0 1 240 0)"/>
  <!-- abdomen -->
  <ellipse cx="120" cy="164" rx="21" ry="36" fill="#FF6A13"/>
  <g clip-path="url(#abd)" fill="#16207A"><rect x="90" y="158" width="60" height="9"/><rect x="90" y="175" width="60" height="9"/><rect x="90" y="191" width="60" height="12"/></g>
  <ellipse cx="120" cy="164" rx="21" ry="36" fill="none" stroke="#16207A" stroke-width="5"/>
  <!-- thorax -->
  <circle cx="120" cy="126" r="23" fill="#FF6A13" stroke="#16207A" stroke-width="5"/>
