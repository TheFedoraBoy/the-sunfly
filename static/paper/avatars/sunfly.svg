    <path d="M106 70C102 56 94 48 84 46M134 70c4-14 12-22 22-24"/>
  </g>
  <circle cx="82" cy="46" r="5.5" fill="#FF6A13" stroke="#16207A" stroke-width="4"/>
  <circle cx="158" cy="46" r="5.5" fill="#FF6A13" stroke="#16207A" stroke-width="4"/>
  <!-- head -->
  <ellipse cx="120" cy="92" rx="33" ry="28" fill="#FF6A13" stroke="#16207A" stroke-width="5"/>
  <path d="M110 110q10 7 21-1" fill="none" stroke="#16207A" stroke-width="4.5" stroke-linecap="round"/>
  <!-- sunglasses -->
  <path d="M80 78h80l-1 8c-2 13-10 19-20 19-9 0-15-5-17-14h-4c-2 9-8 14-17 14-10 0-18-6-20-19z" fill="#16207A" stroke="#16207A" stroke-width="4" stroke-linejoin="round"/>
  <path d="M76 79h88" stroke="#16207A" stroke-width="7" stroke-linecap="round"/>
  <g stroke="#FFFFFF" stroke-width="4" stroke-linecap="round"><path d="M92 97l9-12M101 99l6-8M133 97l9-12M142 99l6-8"/></g>
</svg>