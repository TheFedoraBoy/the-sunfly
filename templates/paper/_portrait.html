{% load static %}{% comment %}
  Usage: {% include "paper/_portrait.html" with person=person extra="small" %}
  A chosen bug avatar wins over a photo; with neither, the Sunfly bug is shown.
{% endcomment %}{% if person.avatar %}<span class="portrait bug {{ extra }}"><img src="{% static person.avatar_path %}" alt="{% if not decorative %}{{ person.name }}'s avatar{% endif %}"></span>{% elif person.photo %}<span class="portrait photo {{ extra }}"><img src="{{ person.photo.url }}" alt="{% if not decorative %}Portrait of {{ person.name }}{% endif %}" loading="lazy"></span>{% else %}<span class="portrait bug {{ extra }}"><img src="{% static 'paper/sunfly.svg' %}" alt=""></span>{% endif %}
